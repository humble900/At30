<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="subtle-contrast" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Optional subtle contrast boundary for dark/light browser tab adaptability -->
  <g transform="rotate(12 32 32)" filter="url(#subtle-contrast)">
    <!-- Primary deep ink brand tile matching Any30 logo -->
    <rect x="10" y="10" width="44" height="44" rx="5" fill="#101310" stroke="#d9ff43" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Inner signature acid-lime square glyph -->
    <rect x="22.5" y="22.5" width="19" height="19" rx="2" fill="none" stroke="#d9ff43" stroke-width="3.5" />
  </g>
</svg>
    <style>
      html, body {
        background-color: #f4f4ed;
        color: #101310;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      #root {
        width: 100%;
        min-height: 100%;
        height: 100%;
      }
      .at30-boot-skeleton {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f4f4ed;
        color: #101310;
        font-family: 'Manrope', system-ui, sans-serif;
      }
      .at30-boot-mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: -0.04em;
      }
      .at30-boot-glyph {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        background: #101310;
        transform: rotate(12deg);
      }
      .at30-boot-glyph span {
        width: 10px;
        height: 10px;
        border: 2px solid #d9ff43;
      }
      .at30-boot-line {
        width: 96px;
        height: 3px;
        background: rgba(16, 19, 16, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .at30-boot-line::after {
        content: '';
        position: absolute;
        inset: 0;
        background: #101310;
        transform: translateX(-100%);
        animation: at30-shimmer 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes at30-shimmer {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0); }
        100% { transform: translateX(100%); }
      }
    </style>
